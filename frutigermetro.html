<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frutiger Metro</title>

    <style>

        body {
            margin: 0px;
            background-color: rgb(239, 240, 250);
        }

        #wallpaper {
            position: relative;
            width: 1470px;
            height: 750px;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #063b91,#0788d8,#32d7e8, #bff9f4
            );
        }


        .circle {
            position: absolute;
            border-radius: 50%;
            background-color: transparent;
        }
        
        #circle1 {
            width: 150px;
            height: 150px;
            left: 35px;
            bottom: 25px;
            border: 12px solid white;
            box-shadow:
                0px 0px 0px 7px #142d85,
                0px 0px 0px 14px #57cbea;
        }

        #circle2 {
            width: 75px;
            height: 75px;
            left: 190px;
            bottom: 120px;
            border: 8px solid white;
            box-shadow:
                0px 0px 0px 5px #22458f;
        }

        #circle3 {
            width: 110px;
            height: 110px;
            left: 265px;
            bottom: 35px;
            border: 10px solid white;
            box-shadow:
         0px 0px 0px 6px #169ed5;
        }

        #circle4 {
            width: 135px;
            height: 135px;
            right: 35px;
            top: 30px;
            border: 15px solid #092a7d;
            box-shadow:
            0px 0px 0px 8px #3fbce2,
            inset 0px 0px 0px 10px #1570c8;
        }


        #circle5 {
            width: 90px;
            height: 90px;
            right: 65px;
            top: 210px;
            border: 9px solid #1a2d5e;
            box-shadow:
            0px 0px 0px 6px #55e4ed;
        }


        #circle6 {
            width: 55px;
            height: 55px;
            left: 80px;
            bottom: 215px;
            border: 7px solid rgb(215, 240, 255);
            box-shadow:
            0px 0px 0px 4px #244b98;
        }


        /* STARS */

        .star {
            position: absolute;
            color: rgb(215, 240, 255);
           
        }


        #star1 {
            left: 15px;
            top: 105px;

            font-size: 100px;

            color: rgb(215, 240, 255);
            text-shadow:
                3px 3px 0px #092a7d,
                -3px -3px 0px #092a7d,
                3px -3px 0px #092a7d,
                -3px 3px 0px #092a7d;
        }


        #star2 {
      right: 175px;
     top: 160px;
     font-size: 120px;
     color: #2fe5ef;
      text-shadow:
      4px 4px 0px #1f3d89,
    -4px -4px 0px #092a7d,
    4px -4px 0px #092a7d,
     -4px 4px 0px #092a7d;
        }


        #star3 {
     right: 40px;
    bottom: 110px;
    font-size: 75px;
      color: white;


      text-shadow:
     3px 3px 0px #1688cf,
     -3px -3px 0px #1688cf,
    3px -3px 0px #1688cf,
    -3px 3px 0px #1688cf;
        }

        .dot {
         position: absolute;
         width: 12px;
         height: 12px;
         background-color: white;
         border-radius: 50%;
        }

        #dot1 {
        left: 400px;
         top: 200px;
        }

        #dot2 {
        left: 450px;
        top: 250px;
        }

        #dot3 {
        right: 150px;
        bottom: 50px;
        }


    </style>

</head>


<body>

    <div id="wallpaper">


        

        <div id="circle1" class="circle"></div>
        <div id="circle2" class="circle"></div>
        <div id="circle3" class="circle"></div>
        <div id="circle4" class="circle"></div>
        <div id="circle5" class="circle"></div>
        <div id="circle6" class="circle"></div>


        <div id="star1" class="star">☆</div>
        <div id="star2" class="star">☆</div>
        <div id="star3" class="star">☆</div>


        <div id="dot1" class="dot"></div>
         <div id="dot2" class="dot"></div>
        <div id="dot3" class="dot"></div>

    </div>

</body>

</html>
